<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 草稿编辑器</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2328; --muted: #656d76;
    --line: #d8dee4; --accent: #1f6feb; --accent-ink: #fff;
    --warn-bg: #fff8c5; --warn-line: #d4a72c; --warn-ink: #5a4a00;
    --danger: #cf222e; --danger-bg: #ffebe9; --ok: #1a7f37; --ok-bg: #dafbe1;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menaka, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  button {
    font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #f3f4f6; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  button.primary:hover { background: #1860c9; }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button.danger:hover { background: var(--danger-bg); }
  button:disabled { opacity: .5; cursor: default; }

  header.bar {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 8px 14px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .title { font-weight: 600; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .title .fname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 38vw; }
  .dirty-dot { color: var(--warn-line); font-size: 18px; line-height: 1; visibility: hidden; }
  .dirty-dot.on { visibility: visible; }
  .spacer { flex: 1; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; }
  .seg button.on { background: #eaf1ff; color: var(--accent); font-weight: 600; }

  .banner {
    max-height: 34%; overflow: auto; border-bottom: 1px solid var(--line);
    background: #fbfbfc; padding: 8px 14px; display: none;
  }
  .banner.show { display: block; }
  .banner h3 { margin: 2px 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
  .draft-card {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
    padding: 8px 12px; margin-bottom: 6px;
  }
  .draft-card .meta { flex: 1; min-width: 260px; }
  .draft-card .name { font-weight: 600; }
  .draft-card .sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
  .chip {
    display: inline-block; font-family: var(--mono); font-size: 11px;
    background: #eef1f4; border: 1px solid var(--line); border-radius: 4px;
    padding: 0 5px; margin: 0 2px; color: #444c56;
  }
  .chip.warn { background: var(--warn-bg); border-color: var(--warn-line); color: var(--warn-ink); }
  .chip.ok { background: var(--ok-bg); border-color: rgba(26,127,55,.4); color: var(--ok); }

  .session-note {
    display: none; margin: 6px 0 0; padding: 6px 10px; border-radius: 6px;
    background: var(--warn-bg); border: 1px solid var(--warn-line); color: var(--warn-ink);
  }
  .session-note.show { display: block; }
  .session-note button { margin-left: 8px; }

  main.work { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  body[data-mode="edit"] main.work { grid-template-columns: 1fr 0; }
  body[data-mode="preview"] main.work { grid-template-columns: 0 1fr; }
  #editor {
    width: 100%; height: 100%; resize: none; border: 0; outline: none;
    padding: 14px 18px; font-family: var(--mono); font-size: 14px; line-height: 1.6;
    background: var(--panel); color: var(--ink);
  }
  #preview {
    overflow: auto; padding: 18px 26px; border-left: 1px solid var(--line);
    background: var(--panel);
  }
  body[data-mode="edit"] #preview { display: none; }
  body[data-mode="preview"] #editor { display: none; }
  body[data-mode="preview"] #preview { border-left: 0; }
  #preview h1,#preview h2 { border-bottom: 1px solid var(--line); padding-bottom: .25em; }
  #preview pre { background: #f6f8fa; padding: 12px; border-radius: 6px; overflow: auto; }
  #preview code { font-family: var(--mono); font-size: .92em; background: #eff1f3; padding: .1em .35em; border-radius: 4px; }
  #preview pre code { background: none; padding: 0; }
  #preview blockquote { margin: .5em 0; padding: .2em 1em; color: var(--muted); border-left: 4px solid var(--line); }
  #preview img { max-width: 100%; }
  #preview hr { border: 0; border-top: 1px solid var(--line); }

  footer.status {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 5px 14px; background: var(--panel); border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted); min-height: 30px;
  }
  footer.status .msg { flex: 1; min-width: 200px; }
  footer.status .msg.warn { color: var(--warn-ink); font-weight: 600; }
  footer.status .msg.err { color: var(--danger); font-weight: 600; }
  footer.status .msg.ok { color: var(--ok); }

  /* 冲突对话框 */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(31,35,40,.45);
    display: none; align-items: center; justify-content: center; z-index: 20; padding: 20px;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--panel); border-radius: 10px; max-width: 980px; width: 100%;
    max-height: 92vh; display: flex; flex-direction: column; box-shadow: 0 12px 40px rgba(0,0,0,.25);
  }
  .modal header { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .modal header h2 { margin: 0 0 4px; font-size: 16px; }
  .modal header p { margin: 0; color: var(--muted); font-size: 13px; }
  .compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0; min-height: 220px; }
  .compare .col { display: flex; flex-direction: column; min-width: 0; padding: 10px 14px; }
  .compare .col:first-child { border-right: 1px solid var(--line); }
  .compare .col h4 { margin: 2px 0 6px; font-size: 13px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .compare textarea {
    flex: 1; width: 100%; resize: none; border: 1px solid var(--line); border-radius: 6px;
    padding: 8px 10px; font-family: var(--mono); font-size: 12px; line-height: 1.5;
    background: #fbfbfc; color: var(--ink);
  }
  .modal .actions {
    display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap;
    padding: 12px 18px; border-top: 1px solid var(--line); background: #fafbfc;
    border-radius: 0 0 10px 10px;
  }

  .toast {
    position: fixed; bottom: 44px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1f2328; color: #fff; padding: 8px 16px; border-radius: 8px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s ease; z-index: 30;
    max-width: 80vw;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .fallback-tip {
    display: none; background: var(--warn-bg); border-bottom: 1px solid var(--warn-line);
    color: var(--warn-ink); padding: 6px 14px; font-size: 12px;
  }
  .fallback-tip.show { display: block; }
  input[type=file] { display: none; }
</style>
</head>
<body data-mode="split">

<header class="bar">
  <div class="title">
    <span class="dirty-dot" id="dirtyDot" title="有未保存的修改">●</span>
    <span class="fname" id="fname">未命名.md</span>
    <span class="chip" id="baseChip" style="display:none" title="草稿所基于的磁盘版本"></span>
  </div>
  <div class="spacer"></div>
  <div class="seg" role="group" aria-label="视图模式">
    <button data-mode="edit">编辑</button>
    <button data-mode="split" class="on">分屏</button>
    <button data-mode="preview">预览</button>
  </div>
  <span id="fsActions">
    <button id="btnOpen">打开…</button>
    <button id="btnSave" class="primary">保存</button>
    <button id="btnSaveAs">另存为…</button>
  </span>
  <span id="fallbackActions" style="display:none">
    <button id="btnImport">导入 .md…</button>
    <button id="btnDownload" class="primary">下载副本</button>
  </span>
  <input type="file" id="fileInput" accept=".md,.markdown,.txt,text/markdown,text/plain">
</header>

<div class="fallback-tip" id="fallbackTip">
  当前浏览器不支持 File System Access API：只能导入文件并下载编辑结果，<b>无法直接写回磁盘上的原文件</b>。
</div>

<section class="banner" id="banner">
  <h3>未保存的草稿（保留在本浏览器 IndexedDB 中）</h3>
  <div id="draftList"></div>
</section>

<div class="banner show" id="sessionNoteWrap" style="display:none;border-bottom:0;padding-bottom:0">
  <div class="session-note" id="sessionNote"></div>
</div>

<main class="work">
  <textarea id="editor" spellcheck="false" placeholder="在此输入 Markdown…"></textarea>
  <div id="preview"></div>
</main>

<footer class="status">
  <span class="msg" id="statusMsg">就绪</span>
  <span class="chip" id="channelChip"></span>
  <span id="countInfo"></span>
</footer>

<div class="modal-mask" id="conflictMask" role="dialog" aria-modal="true" aria-labelledby="conflictTitle">
  <div class="modal">
    <header>
      <h2 id="conflictTitle">保存已暂停：磁盘文件在打开后被外部修改</h2>
      <p>写入前重新读取发现内容与打开时不同。请对比两个版本并选择如何处理；在你选择前不会发生任何写入。</p>
    </header>
    <div class="compare">
      <div class="col">
        <h4>磁盘版（重新读取于 <span id="diskTime"></span>）<span class="chip warn" id="diskChip"></span></h4>
        <textarea id="diskText" readonly></textarea>
      </div>
      <div class="col">
        <h4>草稿版（基于 <span id="baseTime"></span> 的版本 <span class="chip" id="draftBaseChip"></span>）</h4>
        <textarea id="draftText" readonly></textarea>
      </div>
    </div>
    <div class="actions">
      <button id="btnConflictCancel">取消（保留草稿）</button>
      <button id="btnConflictSaveAs">另存为新文件…</button>
      <button id="btnConflictUseDisk" class="primary">用磁盘版替换草稿</button>
      <button id="btnConflictOverwrite" class="danger">仍用草稿覆盖磁盘版</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* == CORE-BEGIN == */
/*
 * 核心逻辑：不依赖 DOM，所有文件系统操作走可替换的 adapter，
 * 草稿持久化走可替换的 drafts 存储（浏览器里是 IndexedDB）。
 */
(function (global) {
  'use strict';

  var EMPTY_DIGEST = 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855';

  var encoder = new TextEncoder();
  function sha256(text) {
    var subtle = global.crypto && global.crypto.subtle;
    if (!subtle) return Promise.reject(new Error('crypto.subtle 不可用'));
    return subtle.digest('SHA-256', encoder.encode(text == null ? '' : String(text)))
      .then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf),
          function (b) { return b.toString(16).padStart(2, '0'); }).join('');
      });
  }
  function uuid() {
    if (global.crypto && typeof global.crypto.randomUUID === 'function') return global.crypto.randomUUID();
    return 'id-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2, 10);
  }
  function isAbort(e) { return !!e && (e.name === 'AbortError'); }
  function isNotAllowed(e) {
    return !!e && (e.name === 'NotAllowedError' || e.name === 'SecurityError' ||
      e.code === 18 || /permission|denied|revoked/i.test(String(e && e.message || '')));
  }
  function errMsg(e) { return (e && e.message) ? String(e.message) : String(e); }
  function suggestName(name) {
    name = name || '未命名.md';
    if (/\.(md|markdown)$/i.test(name)) return name;
    return name.replace(/\.[^.]+$/, '') + '.md';
  }

  /* 所有状态码对应的用户可见文案集中在这里；
     只有真实写回磁盘的操作允许说“保存到原文件”。 */
  var STATUS_TEXT = {
    'idle': '就绪',
    'saving': '正在写入文件…',
    'saved': '已保存到原文件',
    'saved-as': '已另存为新文件（原文件未改动）',
    'saved-partial': '保存时的内容已写回；保存期间又有新输入，新修改尚未保存，草稿已保留',
    'downloaded': '已下载一份 Markdown 副本；未写回任何原文件，原文件保持不变',
    'download-failed': '下载副本失败，未保存草稿仍保留在本地',
    'conflict': '保存已暂停：磁盘文件在打开后被外部修改，请选择保留哪个版本',
    'conflict-open': '冲突尚未解决：请在对话框中选择处理方式',
    'permission-denied': '缺少该文件的写入权限；未保存草稿已保留，请重新授权后再试（不会自动覆盖）',
    'read-failed': '保存前重新读取磁盘文件失败；未保存草稿已保留在本地',
    'write-failed': '写入磁盘失败；未保存草稿已保留在本地',
    'save-cancelled': '已取消保存；未保存草稿保留在本地',
    'saveas-cancelled': '已取消另存为；草稿保留',
    'loaded-disk': '已采用磁盘版内容作为新草稿基线',
    'opened': '已打开磁盘文件',
    'imported': '已导入文件（兼容模式：只能下载结果，不能写回原文件）',
    'open-cancelled': '已取消打开文件',
    'restored-disk-newer': '已恢复草稿；磁盘上有比草稿基线更新的版本，不会自动覆盖',
    'restored-draft-current': '已恢复草稿；磁盘版本与草稿基线一致',
    'restored-need-auth': '已恢复草稿；需要重新授权才能读取或写回该文件，授权前不会有任何写入',
    'restored-local': '已恢复本地草稿',
    'reauth-disk-newer': '重新授权成功，但磁盘版本比草稿基线新：不会自动覆盖，请检查后手动保存',
    'reauthorized': '重新授权成功（尚未写入任何内容）',
    'reauthorized-read-failed': '授权已恢复，但读取磁盘文件失败',
    'reauth-unavailable': '该草稿没有可重新授权的文件句柄',
    'draft-kept': '未保存草稿已备份到本地',
    'edited': '',
    'draft-missing': '该草稿已不存在',
    'draft-discarded': '草稿已丢弃'
  };

  /* ---------- IndexedDB 草稿存储 ---------- */
  function createIdbDrafts(dbName) {
    dbName = dbName || 'md-editor-drafts-v1';
    var indexedDB = global.indexedDB;
    var dbPromise = null;

    function openDb() {
      if (dbPromise) return dbPromise;
      dbPromise = new Promise(function (resolve, reject) {
        var req = indexedDB.open(dbName, 1);
        req.onupgradeneeded = function () {
          var db = req.result;
          if (!db.objectStoreNames.contains('drafts')) {
            db.createObjectStore('drafts', { keyPath: 'id' });
          }
        };
        req.onsuccess = function () { resolve(req.result); };
        req.onerror = function () { reject(req.error || new Error('IndexedDB 打开失败')); };
      });
      return dbPromise;
    }
    function tx(storeName, mode, fn) {
      return openDb().then(function (db) {
        return new Promise(function (resolve, reject) {
          var t = db.transaction(storeName, mode);
          var r;
          try { r = fn(t.objectStore(storeName)); } catch (e) { reject(e); return; }
          t.oncomplete = function () { resolve(r && r.result !== undefined ? r.result : undefined); };
          t.onerror = function () { reject(t.error || new Error('IndexedDB 事务失败')); };
          t.onabort = function () { reject(t.error || new Error('IndexedDB 事务中止')); };
        });
      });
    }
    return {
      put: function (rec) { return tx('drafts', 'readwrite', function (s) { s.put(rec); }); },
      get: function (id) { return tx('drafts', 'readonly', function (s) { return s.get(id); }); },
      all: function () {
        return tx('drafts', 'readonly', function (s) { return s.getAll(); })
          .then(function (rows) { return rows || []; });
      },
      'delete': function (id) { return tx('drafts', 'readwrite', function (s) { s['delete'](id); }); }
    };
  }

  /* ---------- 浏览器 File System Access 适配器 ---------- */
  var browserAdapter = {
    supported: function () {
      return typeof global.showOpenFilePicker === 'function' &&
             typeof global.showSaveFilePicker === 'function';
    },
    open: function () {
      return global.showOpenFilePicker({
        multiple: false,
        types: [{
          description: 'Markdown / 文本',
          accept: { 'text/markdown': ['.md', '.markdown'], 'text/plain': ['.txt'] }
        }]
      }).then(function (handles) { return handles[0]; });
    },
    saveAs: function (suggested) {
      return global.showSaveFilePicker({
        suggestedName: suggested || '未命名.md',
        types: [{ description: 'Markdown', accept: { 'text/markdown': ['.md'] } }]
      });
    },
    read: function (handle) {
      return handle.getFile().then(function (file) { return file.text(); });
    },
    write: function (handle, text) {
      return handle.createWritable().then(function (w) {
        return w.write(text).then(function () { return w.close(); }, function (e) {
          return w.abort().catch(function () {}).then(function () { throw e; });
        });
      });
    },
    queryPermission: function (handle, mode) {
      if (typeof handle.queryPermission !== 'function') return Promise.resolve('granted');
      return Promise.resolve(handle.queryPermission({ mode: mode }));
    },
    requestPermission: function (handle, mode) {
      if (typeof handle.requestPermission !== 'function') return Promise.resolve('granted');
      return Promise.resolve(handle.requestPermission({ mode: mode }));
    },
    download: function (filename, text) {
      var blob = new Blob([text], { type: 'text/markdown;charset=utf-8' });
      var url = global.URL.createObjectURL(blob);
      var a = global.document.createElement('a');
      a.href = url; a.download = filename;
      global.document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { global.URL.revokeObjectURL(url); }, 2000);
    }
  };

  var RECORD_FIELDS = ['id', 'kind', 'name', 'draftText', 'baseDigest',
    'baseAt', 'dirty', 'updatedAt', 'lastDownloadAt'];

  function createController(options) {
    options = options || {};
    var adapter = options.adapter;
    var drafts = options.drafts;
    var clock = options.clock || function () { return Date.now(); };
    var debounceMs = options.debounceMs != null ? options.debounceMs : 400;
    if (!adapter || !drafts) throw new Error('createController: adapter 与 drafts 必传');

    var session = null;
    var status = { code: 'idle', at: 0 };
    var saving = false;
    var conflict = null;   // {diskText,diskDigest,diskReadAt,expectedDigest}
    var gen = 0;           // 每次保存尝试递增；迟到的异步回沿用它识别并放弃
    var writeChain = Promise.resolve();   // 写盘串行队列：旧写入落定后新写入才开始
    var ownWrites = [];    // 本会话已发起写入的内容摘要：读取时据此认出“磁盘上是自己刚写的”
    var persistTimer = null;
    var listeners = [];

    /* 切换文档/草稿时作废旧会话仍在进行的保存：
       迟到的保存结果会因 token 失效被静默丢弃，不再改状态、不清草稿 */
    function invalidatePendingSaves() { gen++; ownWrites = []; }

    /* 所有写盘都经此串行排队：前一次写入落盘后下一次才开始，
       避免被取代的旧写入晚于新写入落盘、把磁盘改回旧内容 */
    function writeLocked(handle, text) {
      var p = writeChain.then(function () { return adapter.write(handle, text); });
      writeChain = p.then(function () {}, function () {});
      return p;
    }

    /* 登记/识别本会话发起的写入。被取代的写入仍可能落盘，而它的完成回调
       会被丢弃、基线来不及推进；之后读到相同内容时不应误报“外部修改” */
    function noteOwnWrite(digest) {
      ownWrites.push(digest);
      if (ownWrites.length > 16) ownWrites.splice(0, ownWrites.length - 16);
    }
    function isOwnWrite(digest) { return ownWrites.indexOf(digest) >= 0; }

    function emit(code, extra) {
      status = { code: code, at: clock() };
      if (extra) Object.keys(extra).forEach(function (k) { status[k] = extra[k]; });
      listeners.slice().forEach(function (fn) {
        try { var r = fn(status); if (r && typeof r.catch === 'function') r.catch(function () {}); }
        catch (e) {}
      });
    }
    function subscribe(fn) { listeners.push(fn); return function () {
      var i = listeners.indexOf(fn); if (i >= 0) listeners.splice(i, 1);
    }; }

    function toRecord(s) {
      if (!s) return null;
      var r = {};
      RECORD_FIELDS.forEach(function (k) {
        if (s[k] !== undefined) r[k] = s[k];
      });
      if (s.handle) r.handle = s.handle;   // 句柄经结构化克隆存入 IndexedDB
      return r;
    }

    function schedulePersist() {
      if (!session || !session.dirty) return;
      if (persistTimer) clearTimeout(persistTimer);
      persistTimer = setTimeout(function () {
        persistNow().then(function () { emit('draft-kept'); })['catch'](function () {});
      }, debounceMs);
    }
    /* 静默写入（调用方需要自己的状态码时不受干扰） */
    function persistNow() {
      if (persistTimer) { clearTimeout(persistTimer); persistTimer = null; }
      var s = session;
      if (!s || !s.dirty) return Promise.resolve();
      s.updatedAt = clock();
      return drafts.put(toRecord(s));
    }
    /* 页面关闭时同步发起事务（IDB 事务创建后通常能完成） */
    function flushBeforeUnload() {
      if (!session || !session.dirty) return Promise.resolve();
      try { return persistNow(); } catch (e) { return Promise.resolve(); }
    }

    function blankLocal() {
      return {
        id: uuid(), kind: 'local', name: '未命名.md',
        draftText: '', baseDigest: EMPTY_DIGEST, baseAt: clock(), dirty: false
      };
    }

    function init() {
      if (!session) session = blankLocal();
      emit('idle');
      return drafts.all();
    }
    function listDrafts() { return drafts.all(); }
    async function discardDraft(id) {
      await drafts['delete'](id);
      if (session && session.id === id) {
        invalidatePendingSaves();
        session = blankLocal(); conflict = null; saving = false;
        emit('idle');
      } else {
        emit('draft-discarded');
      }
    }

    async function findDraftByEntry(handle) {
      if (!handle || typeof handle.isSameEntry !== 'function') return null;
      var rows = await drafts.all();
      for (var i = 0; i < rows.length; i++) {
        var r = rows[i];
        if (r.kind === 'fs' && r.handle) {
          try { if (await handle.isSameEntry(r.handle)) return r; } catch (e) {}
        }
      }
      return null;
    }

    /* ---------- 打开 / 导入 ---------- */
    async function openFile() {
      var handle;
      try { handle = await adapter.open(); }
      catch (e) { if (isAbort(e)) { emit('open-cancelled'); return; } throw e; }
      return openHandle(handle);
    }

    async function openHandle(handle) {
      invalidatePendingSaves();                  // 旧会话在途的保存结果一律作废
      await persistNow();
      conflict = null; saving = false;
      var text;
      try { text = await adapter.read(handle); }
      catch (e) { emit('read-failed', { message: errMsg(e) }); return; }
      var digest = await sha256(text);
      var existing = await findDraftByEntry(handle);
      if (existing) {
        session = existing;
        session.dirty = true;             // 有草稿记录就意味着存在未写入的内容
        session._diskDigest = digest;
        session._diskCheckedAt = clock();
        emit(digest !== existing.baseDigest ? 'restored-disk-newer' : 'restored-draft-current',
          { diskDigest: digest });
      } else {
        session = {
          id: uuid(), kind: 'fs', name: handle.name || '未命名.md', handle: handle,
          draftText: text, baseDigest: digest, baseAt: clock(), dirty: false
        };
        emit('opened', { diskDigest: digest });
      }
    }

    async function importText(name, text) {
      invalidatePendingSaves();                  // 作废旧会话在途的保存
      await persistNow();
      conflict = null; saving = false;
      session = {
        id: uuid(), kind: 'import', name: name || '导入的文档.md',
        draftText: text == null ? '' : String(text),
        baseDigest: await sha256(text == null ? '' : String(text)),
        baseAt: clock(), dirty: false
      };
      emit('imported');
    }

    function setText(text) {
      if (!session) session = blankLocal();
      text = String(text == null ? '' : text);
      if (session.draftText === text) return;
      session.draftText = text;
      session.dirty = true;
      schedulePersist();
      emit('edited');
    }

    /* ---------- 保存主流程 ---------- */
    async function ensureWritable(handle, token) {
      var perm = 'prompt';
      try { perm = await adapter.queryPermission(handle, 'readwrite'); }
      catch (e) { perm = 'prompt'; }
      if (perm !== 'granted') {
        try { perm = await adapter.requestPermission(handle, 'readwrite'); }
        catch (e) { perm = 'denied'; }
      }
      if (token !== gen) return false;           // 已被更新的保存尝试取代
      if (perm !== 'granted') {
        saving = false;
        emit('permission-denied');
        await persistNow();
        return false;
      }
      return true;
    }

    async function readDisk(handle, token) {
      try { return await adapter.read(handle); }
      catch (e) {
        if (token === gen) {
          saving = false;
          emit('read-failed', { message: errMsg(e) });
          await persistNow();
        }
        return null;
      }
    }

    async function doWrite(s, text, token) {
      if (token !== gen || session !== s) return false;   // 落盘前最后确认未被取代
      var digest = await sha256(text);
      if (token !== gen || session !== s) return false;
      noteOwnWrite(digest);                               // 登记在途写入，供后续读取识别
      try { await writeLocked(s.handle, text); }
      catch (e) {
        if (token !== gen || session !== s) return false;
        saving = false;
        emit(isNotAllowed(e) ? 'permission-denied' : 'write-failed', { message: errMsg(e) });
        await persistNow();
        return false;
      }
      if (token !== gen || session !== s) return false;   // 迟到的写入结果：交由新尝试处理
      s.baseDigest = digest;
      s.baseAt = clock();
      s._diskDigest = digest;
      s._diskCheckedAt = clock();
      conflict = null;
      saving = false;
      if (s.draftText === text) {
        s.dirty = false;
        try { await drafts['delete'](s.id); } catch (e) {}
        emit('saved', { digest: digest });
      } else {
        /* 写入期间用户又输入了内容：磁盘只包含到 text 为止。
           基线推进到已写回的版本，但 dirty 与草稿必须保留，状态不得谎称全部保存。 */
        s.dirty = true;
        await persistNow();
        emit('saved-partial', { digest: digest });
      }
      return true;
    }

    async function saveFs(s) {
      if (conflict) { emit('conflict-open'); return; }
      var token = ++gen;
      saving = true;
      emit('saving');
      try {
        if (!await ensureWritable(s.handle, token)) return;
        var diskText = await readDisk(s.handle, token);
        if (diskText === null) return;
        if (token !== gen) return;               // 迟到读取：直接丢弃，不弹窗也不写入
        var diskDigest = await sha256(diskText);
        if (token !== gen) return;               // 摘要计算期间被更新的尝试取代
        if (diskDigest !== s.baseDigest) {
          if (isOwnWrite(diskDigest)) {
            /* 磁盘上是自己此前发起、刚落盘的写入（该尝试被取代，基线没来得及
               推进）：不是外部修改，把基线对齐到它，继续写当前草稿 */
            s.baseDigest = diskDigest;
            s.baseAt = clock();
            s._diskDigest = diskDigest;
            s._diskCheckedAt = clock();
          } else {
            // 外部修改：暂停写入，保留草稿，等用户选择
            conflict = {
              diskText: diskText, diskDigest: diskDigest,
              diskReadAt: clock(), expectedDigest: s.baseDigest
            };
            saving = false;
            emit('conflict', { diskDigest: diskDigest });
            await persistNow();
            return;
          }
        }
        await doWrite(s, s.draftText, token);
      } catch (e) {
        if (token === gen) {
          saving = false;
          emit('write-failed', { message: errMsg(e) });
          await persistNow();
        }
      }
    }

    function downloadDraft() {
      var s = session;
      if (!s) return;
      var filename = suggestName(s.name);
      try { adapter.download(filename, s.draftText); }
      catch (e) { emit('download-failed', { message: errMsg(e) }); return; }
      s.lastDownloadAt = clock();
      emit('downloaded', { filename: filename });
      schedulePersist();
    }

    function save() {
      if (!session) return Promise.resolve();
      if (session.kind !== 'fs') { downloadDraft(); return Promise.resolve(); }
      return saveFs(session);
    }

    /* ---------- 冲突解决 ---------- */
    async function resolveConflict(choice) {
      var c = conflict, s = session;
      if (!c || !s) return;
      if (choice === 'cancel') {
        conflict = null; saving = false;
        emit('save-cancelled');
        await persistNow();
        return;
      }
      if (choice === 'use-disk') {
        conflict = null; saving = false;
        s.draftText = c.diskText;
        s.baseDigest = c.diskDigest;
        s.baseAt = c.diskReadAt || clock();
        s.dirty = false;
        s._diskDigest = c.diskDigest;
        s._diskCheckedAt = clock();
        try { await drafts['delete'](s.id); } catch (e) {}
        emit('loaded-disk', { digest: c.diskDigest });
        return;
      }
      if (choice === 'overwrite') {
        var token = ++gen;
        saving = true;
        emit('saving');
        if (!await ensureWritable(s.handle, token)) return;   // 保留对话框
        var diskText = await readDisk(s.handle, token);
        if (diskText === null) return;
        if (token !== gen) return;
        var diskDigest = await sha256(diskText);
        if (token !== gen) return;
        if (diskDigest !== c.diskDigest && !isOwnWrite(diskDigest)) {
          // 对话框打开期间磁盘又被改了（且不是自己的在途写入）：刷新对比，要求再次确认
          conflict = {
            diskText: diskText, diskDigest: diskDigest,
            diskReadAt: clock(), expectedDigest: s.baseDigest
          };
          saving = false;
          emit('conflict', { diskDigest: diskDigest });
          return;
        }
        conflict = null;
        await doWrite(s, s.draftText, token);
        return;
      }
      if (choice === 'saveas') {
        conflict = null;
        return saveAs();
      }
    }

    async function saveAs() {
      var s = session;
      if (!s) return;
      if (typeof adapter.saveAs !== 'function') { downloadDraft(); return; }
      var token = ++gen;
      saving = true; conflict = null;
      emit('saving');
      var handle;
      try { handle = await adapter.saveAs(suggestName(s.name)); }
      catch (e) {
        if (token === gen) {
          saving = false;
          emit(isAbort(e) ? 'saveas-cancelled' : 'write-failed', { message: errMsg(e) });
        }
        return;
      }
      if (token !== gen) return;
      var text = s.draftText;                    // 快照：picker 期间用户可能继续输入
      try { await writeLocked(handle, text); }
      catch (e) {
        if (token === gen) {
          saving = false;
          emit(isNotAllowed(e) ? 'permission-denied' : 'write-failed', { message: errMsg(e) });
          await persistNow();
        }
        return;
      }
      if (token !== gen) return;
      var oldId = s.id;
      var digest = await sha256(text);
      if (token !== gen) return;
      s.kind = 'fs';
      s.handle = handle;
      s.name = handle.name || s.name;
      s.baseDigest = digest;
      s.baseAt = clock();
      s._diskDigest = digest;
      s._diskCheckedAt = clock();
      saving = false;
      if (s.draftText === text) {
        s.dirty = false;
        try { await drafts['delete'](oldId); } catch (e) {}
        emit('saved-as', { digest: digest, name: s.name });
      } else {
        /* 写入期间又有新输入：新文件只包含到快照为止，dirty 与草稿保留 */
        s.dirty = true;
        await persistNow();
        emit('saved-partial', { digest: digest, name: s.name });
      }
    }

    /* ---------- 草稿恢复 / 重新授权 ---------- */
    async function restore(id) {
      var rec = await drafts.get(id);
      if (!rec) { emit('draft-missing'); return null; }
      invalidatePendingSaves();                  // 作废旧会话在途的保存
      await persistNow();
      session = rec;
      conflict = null; saving = false;
      session._diskDigest = null;
      session._diskCheckedAt = null;
      if (rec.kind === 'fs' && rec.handle) {
        var perm = 'prompt';
        try { perm = await adapter.queryPermission(rec.handle, 'readwrite'); }
        catch (e) { perm = 'prompt'; }
        if (perm === 'granted') {
          try {
            var text = await adapter.read(rec.handle);
            var d = await sha256(text);
            session._diskDigest = d;
            session._diskCheckedAt = clock();
            emit(d !== rec.baseDigest ? 'restored-disk-newer' : 'restored-draft-current',
              { diskDigest: d });
          } catch (e) { emit('restored-need-auth'); }
        } else {
          emit('restored-need-auth');
        }
      } else {
        emit('restored-local');
      }
      return rec;
    }

    /* 只申请授权 + 读取比对，绝不写入；磁盘较新时明确提示 */
    async function reauthorize(id) {
      var rec = id ? await drafts.get(id) : session;
      if (!rec || !rec.handle) { emit('reauth-unavailable'); return false; }
      var perm;
      try { perm = await adapter.requestPermission(rec.handle, 'readwrite'); }
      catch (e) { perm = 'denied'; }
      if (perm !== 'granted') { emit('permission-denied'); return false; }
      try {
        var text = await adapter.read(rec.handle);
        var d = await sha256(text);
        if (session && session.id === rec.id) {
          session._diskDigest = d;
          session._diskCheckedAt = clock();
        }
        emit(d !== rec.baseDigest ? 'reauth-disk-newer' : 'reauthorized', { diskDigest: d });
      } catch (e) {
        emit('reauthorized-read-failed', { message: errMsg(e) });
      }
      return true;
    }

    function getState() {
      var s = session;
      return {
        supported: adapter.supported(),
        session: s ? {
          id: s.id, kind: s.kind, name: s.name,
          draftText: s.draftText, dirty: !!s.dirty,
          baseDigest: s.baseDigest, baseAt: s.baseAt,
          updatedAt: s.updatedAt, lastDownloadAt: s.lastDownloadAt,
          diskDigest: s._diskDigest || null,
          diskCheckedAt: s._diskCheckedAt || null,
          hasHandle: !!s.handle
        } : null,
        saving: saving,
        conflict: conflict ? {
          diskText: conflict.diskText, diskDigest: conflict.diskDigest,
          diskReadAt: conflict.diskReadAt, expectedDigest: conflict.expectedDigest
        } : null,
        status: status
      };
    }

    return {
      subscribe: subscribe,
      getState: getState,
      init: init,
      listDrafts: listDrafts,
      discardDraft: discardDraft,
      openFile: openFile,
      openHandle: openHandle,
      importText: importText,
      setText: setText,
      save: save,
      saveAs: saveAs,
      resolveConflict: resolveConflict,
      restore: restore,
      reauthorize: reauthorize,
      flushBeforeUnload: flushBeforeUnload,
      _persistNow: persistNow
    };
  }

  global.MDE = {
    createController: createController,
    createIdbDrafts: createIdbDrafts,
    browserAdapter: browserAdapter,
    sha256: sha256,
    EMPTY_DIGEST: EMPTY_DIGEST,
    STATUS_TEXT: STATUS_TEXT,
    suggestName: suggestName,
    isAbort: isAbort

})(typeof window !== 'undefined' ? window : globalThis);
/* == CORE-END == */
</script>

<script>
/* ============== UI 层（仅在浏览器运行） ============== */
(function () {
  'use strict';
  var M = window.MDE;

  var $ = function (id) { return document.getElementById(id); };
  var editor = $('editor'), preview = $('preview');

  var controller = M.createController({
    adapter: M.browserAdapter,
    drafts: M.createIdbDrafts(),
    debounceMs: 500
  });

  var KIND_LABEL = { fs: '磁盘文件草稿', import: '导入文件草稿（无法写回）', local: '本地草稿' };
  var WARN_CODES = { conflict: 1, 'conflict-open': 1, 'permission-denied': 1,
    'read-failed': 1, 'write-failed': 1, 'reauth-disk-newer': 1,
    'restored-disk-newer': 1, 'restored-need-auth': 1, 'save-cancelled': 1,
    'download-failed': 1, 'reauthorized-read-failed': 1, 'saved-partial': 1 };
  var ERR_CODES = { 'permission-denied': 1, 'read-failed': 1, 'write-failed': 1,
    'download-failed': 1, 'reauthorized-read-failed': 1 };
  var OK_CODES = { saved: 1, 'saved-as': 1, downloaded: 1, 'loaded-disk': 1, reauthorized: 1 };
  var TOAST_CODES = { saved: 1, 'saved-as': 1, downloaded: 1, 'permission-denied': 1,
    'read-failed': 1, 'write-failed': 1, 'reauth-disk-newer': 1, 'loaded-disk': 1,
    'saved-partial': 1 };

  function fmtTime(ts) {
    if (!ts) return '未知时间';
    return new Date(ts).toLocaleString('zh-CN', { hour12: false });
  }
  function chip(d, cls, title) {
    if (!d) return '';
    return '<span class="chip ' + (cls || '') + '"' + (title ? ' title="' + title + '"' : '') +
           '>#' + d.slice(0, 8) + '</span>';
  }

  /* ---------- Markdown 渲染（轻量实现，默认转义） ---------- */
  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;');
  }
  function renderInline(s) {
    var codes = [];
    s = s.replace(/`([^`]+)`/g, function (m, c) {
      codes.push('<code>' + c + '</code>');
      return 'C' + (codes.length - 1) + '';
    });
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, '<img alt="$1" src="$2">');
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,
      '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, '$1<em>$2</em>');
    s = s.replace(/~~([^~]+)~~/g, '<del>$1</del>');
    codes.forEach(function (c, i) {
      s = s.split('C' + i + '').join(c);
    });
    return s;
  }
  function renderMarkdown(md) {
    var fences = [];
    var text = String(md || '').replace(/\r\n?/g, '\n')
      .replace(/```([^\n`]*)\n?([\s\S]*?)(?:```|$)/g, function (m, lang, code) {
        fences.push('<pre><code>' + escapeHtml(code.replace(/\n$/, '')) + '</code></pre>');
        return '\nF' + (fences.length - 1) + '\n';
      });
    text = escapeHtml(text);
    var lines = text.split('\n');
    var html = '', listType = null;
    function closeList() { if (listType) { html += '</' + listType + '>'; listType = null; } }
    function isPlain(ln) {
      return ln.trim() !== '' && !/^F\d+$/.test(ln) &&
        !/^(#{1,6})\s/.test(ln) && !/^\s*([-*_])\1{2,}\s*$/.test(ln) &&
        !/^>\s?/.test(ln) && !/^\s*([-*]|\d+\.)\s+/.test(ln);
    }
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i], m;
      if ((m = ln.match(/^F(\d+)$/))) { closeList(); html += fences[+m[1]]; continue; }
      if (/^\s*$/.test(ln)) { closeList(); continue; }
      if ((m = ln.match(/^(#{1,6})\s+(.*)$/))) {
        closeList(); var lvl = m[1].length;
        html += '<h' + lvl + '>' + renderInline(m[2]) + '</h' + lvl + '>'; continue;
      }
      if (/^\s*([-*_])\1{2,}\s*$/.test(ln)) { closeList(); html += '<hr>'; continue; }
      if ((m = ln.match(/^>\s?(.*)$/))) { closeList(); html += '<blockquote>' + renderInline(m[1]) + '</blockquote>'; continue; }
      if ((m = ln.match(/^\s*[-*]\s+(.*)$/))) {
        if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
        html += '<li>' + renderInline(m[1]) + '</li>'; continue;
      }
      if ((m = ln.match(/^\s*\d+\.\s+(.*)$/))) {
        if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
        html += '<li>' + renderInline(m[1]) + '</li>'; continue;
      }
      closeList();
      var buf = [ln];
      while (i + 1 < lines.length && isPlain(lines[i + 1])) buf.push(lines[++i]);
      html += '<p>' + buf.map(renderInline).join('<br>') + '</p>';
    }
    closeList();
    return html;
  }

  /* ---------- Toast ---------- */
  var toastTimer = null;
  function toast(msg) {
    var el = $('toast');
    el.textContent = msg;
    el.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 3200);
  }

  /* ---------- 渲染 ---------- */
  function renderSession() {
    var st = controller.getState();
    var s = st.session;
    if (s) {
      $('fname').textContent = s.name;
      $('dirtyDot').classList.toggle('on', !!s.dirty);
      var bc = $('baseChip');
      if (s.kind === 'fs') {
        bc.style.display = '';
        bc.textContent = '基线 #' + s.baseDigest.slice(0, 8);
        bc.title = '草稿基于的磁盘版本（打开或上次成功保存时读取）\n' + fmtTime(s.baseAt);
        bc.className = 'chip' + (s.diskDigest && s.diskDigest !== s.baseDigest ? ' warn' : '');
      } else {
        bc.style.display = 'none';
      }
      if (document.activeElement !== editor && st.status.code !== 'edited' &&
          editor.value !== s.draftText) {
        editor.value = s.draftText;
      }
      preview.innerHTML = renderMarkdown(s.draftText);
      var n = s.draftText.length;
      $('countInfo').textContent = n + ' 字符 · ' + (s.draftText ? s.draftText.split('\n').length : 1) + ' 行';
      $('channelChip').textContent = s.kind === 'fs'
        ? 'File System Access：可写回原文件'
        : (s.kind === 'import' ? '兼容模式：导入 / 下载' : '本地草稿：尚未关联文件');
      $('channelChip').className = 'chip' + (s.kind === 'fs' ? ' ok' : 'warn');
      renderSessionNote(st);
    }
    document.title = (s && s.dirty ? '● ' : '') + (s ? s.name : 'Markdown 编辑器') + ' - Markdown 草稿编辑器';
  }

  function renderSessionNote(st) {
    var s = st.session, wrap = $('sessionNoteWrap'), note = $('sessionNote');
    var html = '';
    if (s && s.kind === 'fs') {
      if (st.status.code === 'permission-denied') {
        html = '该文件的授权已被撤销或拒绝，未保存草稿已保留。重新授权后若磁盘较新，也<b>不会自动覆盖</b>。' +
          '<button id="noteReauth" class="primary">重新授权</button>';
      } else if (s.diskDigest && s.diskDigest !== s.baseDigest) {
        html = '磁盘上的版本 ' + chip(s.diskDigest, 'warn') + ' 比草稿基线 ' +
          chip(s.baseDigest) + ' 新（读取于 ' + fmtTime(s.diskCheckedAt) +
          '）。点击“保存”将并排对比两个版本，不会自动覆盖。';
      }
    }
    note.innerHTML = html;
    wrap.style.display = html ? 'block' : 'none';
    var b = $('noteReauth');
    if (b) b.onclick = function () { controller.reauthorize(); };
  }

  async function renderDrafts() {
    var rows = await controller.listDrafts();
    var list = $('draftList'), banner = $('banner');
    if (!rows.length) { banner.classList.remove('show'); list.innerHTML = ''; return; }
    banner.classList.add('show');
    var currentId = controller.getState().session.id;
    list.innerHTML = rows.map(function (r) {
      var isFs = r.kind === 'fs';
      return '<div class="draft-card" data-id="' + r.id + '">' +
        '<div class="meta">' +
          '<div class="name">' + escapeHtml(r.name) +
            (r.id === currentId ? ' <span class="chip ok">当前</span>' : '') +
          '</div>' +
          '<div class="sub">' + KIND_LABEL[r.kind] + ' · 更新于 ' + fmtTime(r.updatedAt) +
            (isFs ? ' · 草稿所属文件版本：' + chip(r.baseDigest, 'warn',
              '打开或上次成功保存时的磁盘内容摘要\n' + fmtTime(r.baseAt)) +
              '（' + fmtTime(r.baseAt) + '）' : '') +
            (r.lastDownloadAt ? ' · 上次下载副本：' + fmtTime(r.lastDownloadAt) : '') +
          '</div>' +
        '</div>' +
        '<button class="primary" data-act="restore">恢复草稿</button>' +
        (isFs ? '<button data-act="reauth">重新授权</button>' : '') +
        '<button class="danger" data-act="discard">丢弃</button>' +
      '</div>';
    }).join('');
    Array.prototype.forEach.call(list.querySelectorAll('.draft-card'), function (card) {
      var id = card.getAttribute('data-id');
      card.querySelector('[data-act="restore"]').onclick = function () { controller.restore(id); };
      var ra = card.querySelector('[data-act="reauth"]');
      if (ra) ra.onclick = function () { controller.reauthorize(id); };
      card.querySelector('[data-act="discard"]').onclick = function () {
        if (confirm('确定丢弃该未保存草稿？此操作不可撤销。')) controller.discardDraft(id);
      };
    });
  }

  function renderStatus() {
    var st = controller.getState();
    var code = st.status.code;
    var msg = M.STATUS_TEXT[code];
    if (msg) {
      var el = $('statusMsg');
      el.textContent = msg;
      el.className = 'msg' + (ERR_CODES[code] ? ' err' : WARN_CODES[code] ? ' warn' : OK_CODES[code] ? ' ok' : '');
    }
    if (TOAST_CODES[code]) toast(M.STATUS_TEXT[code]);
    if (code === 'loaded-disk' || code.indexOf('restored-') === 0) {
      editor.value = st.session.draftText;
    }
    if (code === 'conflict') openConflict(st.conflict);
  }

  /* ---------- 冲突对话框 ---------- */
  function openConflict(c) {
    var st = controller.getState(), s = st.session;
    $('diskChip').textContent = '#' + c.diskDigest.slice(0, 8);
    $('diskTime').textContent = fmtTime(c.diskReadAt);
    $('diskText').value = c.diskText;
    $('draftBaseChip').textContent = '#' + c.expectedDigest.slice(0, 8);
    $('baseTime').textContent = fmtTime(s.baseAt);
    $('draftText').value = s.draftText;
    $('conflictMask').classList.add('show');
  }
  function closeConflict() { $('conflictMask').classList.remove('show'); }

  $('btnConflictCancel').onclick = function () { controller.resolveConflict('cancel').then(closeConflict); };
  $('btnConflictUseDisk').onclick = function () {
    controller.resolveConflict('use-disk').then(function () { editor.value = controller.getState().session.draftText; closeConflict(); });
  };
  $('btnConflictOverwrite').onclick = function () { controller.resolveConflict('overwrite').then(function () {
    if (!controller.getState().conflict) closeConflict();
  }); };
  $('btnConflictSaveAs').onclick = function () { controller.resolveConflict('saveas').then(closeConflict); };

  /* ---------- 工具栏 ---------- */
  var supported = M.browserAdapter.supported();
  $('fsActions').style.display = supported ? '' : 'none';
  $('fallbackActions').style.display = supported ? 'none' : '';
  $('fallbackTip').classList.toggle('show', !supported);
  $('btnSave').disabled = !supported;
  if (!supported) $('btnSave').title = '当前环境不支持直接写回文件';

  $('btnOpen').onclick = function () { controller.openFile(); };
  $('btnSave').onclick = function () { controller.save(); };
  $('btnSaveAs').onclick = function () { controller.saveAs(); };
  $('btnDownload').onclick = function () { controller.save(); };
  $('btnImport').onclick = function () { $('fileInput').click(); };
  $('fileInput').addEventListener('change', function () {
    var f = this.files && this.files[0];
    if (!f) return;
    f.text().then(function (text) {
      return controller.importText(f.name, text);
    })['catch'](function () {});
    this.value = '';
  });

  document.querySelectorAll('.seg button').forEach(function (b) {
    b.onclick = function () {
      document.body.setAttribute('data-mode', b.getAttribute('data-mode'));
      document.querySelectorAll('.seg button').forEach(function (x) {
        x.classList.toggle('on', x === b);
      });
    };
  });

  /* ---------- 编辑事件 ---------- */
  var renderQueued = false;
  editor.addEventListener('input', function () {
    controller.setText(editor.value);
    if (!renderQueued) {
      renderQueued = true;
      requestAnimationFrame(function () {
        preview.innerHTML = renderMarkdown(editor.value);
        renderQueued = false;
      });
    }
  });

  controller.subscribe(function (status) {
    renderStatus();
    renderSession();
    renderDrafts();
  });

  window.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'S')) {
      e.preventDefault();
      controller.save();
    }
  });

  window.addEventListener('beforeunload', function (e) {
    var st = controller.getState();
    if ((st.session && st.session.dirty) || st.saving) {
      e.preventDefault();
      e.returnValue = '';
    }
  });
  window.addEventListener('pagehide', function () {
    try { controller.flushBeforeUnload(); } catch (e) {}
  });
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') controller.flushBeforeUnload();
  });

  /* ---------- 启动 ---------- */
  controller.init().then(function () {
    renderStatus();
    renderSession();
    renderDrafts();
  });
})();
</script>
</body>
</html>
